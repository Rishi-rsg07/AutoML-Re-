version: '3.8'

services:
  backend:
    build: ./backend
    container_name: streamline_backend
    ports:
      - "8000:8000"
    volumes:
      - /tmp:/tmp

  frontend:
    image: python:3.10-slim
    container_name: streamline_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "8501:8501"
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             streamlit run app.py --server.port=8501 --server.address=0.0.0.0"
    depends_on:
      - backend
